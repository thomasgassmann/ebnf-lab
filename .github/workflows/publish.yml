name: Publish npm package
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Ensure tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const version=require('./packages/ebnf-lab/package.json').version; if (process.env.RELEASE_TAG !== 'v'+version) process.exit(1)"
      - name: Publish ebnf-lab
        working-directory: packages/ebnf-lab
        # Authenticates via OIDC using the trusted publisher configured on
        # npmjs.com; no NPM_TOKEN secret. Provenance is generated
        # automatically.
        run: npm publish --access public
